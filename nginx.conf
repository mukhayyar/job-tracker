server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare-friendly: respect X-Forwarded-Proto
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets, not HTML (so deploys invalidate fast)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # SPA-friendliness: hash-routing (#tracker etc.) needs no rewrite,
    # but a direct /index.html hit should work and unknown paths fall back.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
